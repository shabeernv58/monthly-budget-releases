  let kind = old ? old.kind : 'purchase', field = null;
  const spans = {}; // field -> Set of token indexes
  const name = { v: old ? old.name : '' };
  const draw = () => {
    const T = TEACH_TYPES[kind];
    if (!field || !T.fields.some(f => f[0] === field)) field = T.fields.length ? T.fields[0][0] : null;
    const owner = i => Object.keys(spans).find(f => spans[f].has(i) && T.fields.some(x => x[0] === f));
    const sp = {}; Object.keys(spans).forEach(f => { if (!T.fields.some(x => x[0] === f) || !spans[f].size) return; const ix = [...spans[f]].sort((a, b) => a - b); sp[f] = [toks[ix[0]].s, toks[ix[ix.length - 1]].e]; });
    const missing = T.fields.filter(f => f[2] && !sp[f[0]]).map(f => f[1]);
    let preview = '', also = 0, pat = null;
    if (!missing.length) {
      pat = buildPattern(body, sp, kind);
      const r = pat && Object.assign({ id: 'x', kind, biller: name.v.trim() }, pat);
      const o = r && applyRule(r, body);
      if (!o) preview = '<p class="neg">This pattern doesn\'t read the message back. Try selecting fewer words for the name.</p>';
      else {
        preview = `<div class="list"><div class="row"><span class="t"><span class="n">${esc(T.label)}${o.biller ? ' · ' + esc(o.biller) : ''}${o.merchant ? ' · ' + esc(o.merchant) : ''}</span><span class="s">${o.amount ? 'AED ' + esc(o.amount) : ''}${o.total ? 'total AED ' + esc(o.total) : ''}${o.min ? ' · min ' + esc(o.min) : ''}${o.due ? ' · due ' + esc(fmtDay(o.due)) : ''}${o.card ? ' · card ' + esc(o.card) : ''}</span></span><span class="a">✓</span></div></div>`;
        also = unreadMsgs().filter(t => t.body !== body && applyRule(r, t.body)).length;
      }
    }
    $('#sheet').innerHTML = `<h3>${old ? 'Edit taught message' : 'Teach the app'}</h3>
      <label class="f"><span>1. What is this message?</span><select id="tKind">${Object.entries(TEACH_TYPES).map(([k, v]) => `<option value="${k}" ${k === kind ? 'selected' : ''}>${esc(v.label)}</option>`).join('')}</select></label>
      ${T.fields.length ? `<div class="f"><span>2. Choose a detail, then tap its words in the message</span><div class="filt">${T.fields.map(([f, l, req]) => `<button type="button" class="cchip tf-${f}" data-tf="${f}" aria-pressed="${field === f}">${esc(l)}${req ? '' : ' (optional)'}${sp[f] ? ' ✓' : ''}</button>`).join('')}</div></div>` : '<p class="muted">Messages like this will go to the hidden Ignored list.</p>'}
      <div class="tokbox" aria-label="Message">${toks.map((t, i) => { const o = owner(i); const gap = i && toks[i - 1].e < t.s ? ' ' : ''; return `${gap}<button type="button" class="tok${o ? ' on tf-' + o : ''}" data-ti="${i}">${esc(t.t)}</button>`; }).join('')}</div>
      ${T.name ? `<label class="f"><span>Name to show for these bills</span><input id="tName" value="${esc(name.v)}" placeholder="e.g. Wifi bill"></label>` : `<label class="f"><span>Name for this pattern (optional)</span><input id="tName" value="${esc(name.v)}" placeholder="e.g. ADCB card purchase"></label>`}
      <h2>3. Check what it reads</h2>
      ${missing.length ? `<p class="muted">Still to tap: ${esc(missing.join(', '))}</p>` : preview}
      ${also ? `<p class="muted">Also reads ${also} other unread message${also > 1 ? 's' : ''}; they'll be updated too.</p>` : ''}
      <div class="btns"><button class="btn pri" id="tSave" ${missing.length || !pat ? 'disabled' : ''}>Save</button><button class="btn" id="tClear">Clear taps</button><button class="btn" id="tCancel">Cancel</button></div>
      <p class="muted">The first 3 messages read with a new pattern ask you to confirm before it's trusted.</p>`;
    $('#veil').classList.add('on');
    $('#tKind').onchange = e => { kind = e.target.value; draw(); };
    $('#tName').oninput = e => { name.v = e.target.value; };
    document.querySelectorAll('[data-tf]').forEach(b => b.onclick = () => { field = b.dataset.tf; draw(); });
    document.querySelectorAll('[data-ti]').forEach(b => b.onclick = () => {
      if (!field) return;
      const i = +b.dataset.ti;
      Object.keys(spans).forEach(f => { if (f !== field) spans[f].delete(i); });
      const s = spans[field] = spans[field] || new Set();
      if (s.has(i)) s.delete(i); else s.add(i);
      draw();
    });
    $('#tClear').onclick = () => { Object.keys(spans).forEach(f => delete spans[f]); draw(); };
    $('#tCancel').onclick = closeSheet;
    $('#tSave').onclick = () => {
      if (!pat) return;
      if (T.name && !name.v.trim()) { toast('Give the bills a name'); return; }
      snap();
      const a = ACT(); a.learned = a.learned || [];
      const r = old || { id: uid(), created: today(), confirms: 0, trusted: false };
      Object.assign(r, pat, { kind, name: name.v.trim() || T.label, biller: T.name ? name.v.trim() : '', sample: body.slice(0, 400) });
      if (old) { r.confirms = 0; r.trusted = false; } else a.learned.unshift(r);
      if (kind === 'ignored') r.trusted = true; // ignored messages are kept in the hidden list, nothing to confirm
      const n = reapplyRule(r);
      if (ctx.txnId && !n) { /* the message itself was pasted or no longer stored */ }
      save(); syncNative(); closeSheet(); render();
      toast(`Saved. ${n ? n + ' stored message' + (n > 1 ? 's' : '') + ' re-read.' : 'Similar messages will be read from now on.'}`, true);
    };
  };
  // editing: show the old taps again by reading the sample with the old pattern
  if (old) { const o = applyRule(old, body); if (o) TEACH_TYPES[kind].fields.forEach(([f]) => { if (!o[f]) return; const at = body.toLowerCase().indexOf(String(o[f]).toLowerCase()); if (at < 0) return; spans[f] = new Set(toks.map((t, i) => (t.s >= at && t.s < at + String(o[f]).length) ? i : -1).filter(i => i >= 0)); }); }
  draw();
};

const renameCatEverywhere = (from, to) => {

// goals reached since the last check (each one notified once)
const goalCheck = () => {
  const n = NOTIF(); if (!n.on || !n.goal || !S.savings || !SV().pots) return;
  const st = S.settings.notifState = S.settings.notifState || {}; st.goals = st.goals || {};
  for (const p of SV().pots) {
    if (p.kind !== 'goal' || p.archived || !(+p.target > 0)) continue;
    const c = potCalc(p), hit = c.bal >= c.target;
    if (hit && !st.goals[p.id]) { st.goals[p.id] = 1; notifyNow('Savings goal reached', `${p.name}: ${p.currency} ${fmt(c.bal)} of ${fmt(c.target)}. Well done.`, 'savings'); }
    else if (!hit && st.goals[p.id]) delete st.goals[p.id];
  }
};

const buildNotes = () => {
  const n = NOTIF(), out = [], now = Date.now(), td = today(), mk = nowKey();
  const add = (id, ymd, time, title, text, open, dyn) => { const at = atMs(ymd, time); if (at > now + 30000) out.push({ id, at, title, text, open: open || '', dyn: dyn || '' }); };
  if (!n.on) return out;
  if (n.uncat) for (let i = 0; i < 7; i++) { const d = addDays(td, i); add('uncat-' + d, d, n.uncatTime, 'Pending actions', '', 'budget', 'uncat'); }
  const lastDay = periodEnd(mk); // last day of this tracking month
  if (n.monthEnd) add('monthend-' + mk, lastDay, '19:00', `${mLabel(mk)} ends today`, '', 'budget', 'monthEnd');
  if (n.newMonth) { const nk = addM(mk, 1); add('newmonth-' + nk, periodStart(nk), '09:00', `${mLabel(nk)} has started`, `Set up its plan on the ${tabName('month')} tab.`, 'month'); }
  if (n.owed) {
    const d = ffDebts();
    if (d.oweAED > 0.5 || d.owedAED > 0.5) {
      const fri = (() => { const t = new Date(); const add2 = (5 - t.getDay() + 7) % 7; return addDays(td, add2); })();
      const parts = []; if (d.owedAED > 0.5) parts.push(`owed to you ${MAIN()} ${fmtM(d.owedAED)}`); if (d.oweAED > 0.5) parts.push(`you owe ${MAIN()} ${fmtM(d.oweAED)}`);
      for (const wk of [0, 7]) { const d2 = addDays(fri, wk); add('owed-' + d2, d2, '19:00', 'Family & friends', parts.join(' · ').replace(/^./, c => c.toUpperCase()) + '.', 'family-owe'); }
    }
  }
  if (n.backup && Object.keys(S.months).length) {
    const due = S.lastBackup ? addDays(new Date(S.lastBackup).toISOString().slice(0, 10), +n.backupDays || 14) : td;
    const day = due > td ? due : addDays(td, 1);
    add('backup-' + day, day, '10:00', 'Time for a backup', `Your last backup was ${S.lastBackup ? fmtDay(new Date(S.lastBackup).toISOString().slice(0, 10)) : 'never'}. Settings › Save a backup.`, 'more');
  }
  if (n.emi) for (const l of S.loans) {
    if (l.closed || !(+l.emi > 0) || !(+l.emiDay >= 1)) continue;

// ---------- app lock: PIN / pattern / fingerprint ----------
// App 1.9+: the check lives on the Android side (LockStore): an HMAC under a key in the Android Keystore, with
// the wrong-try count kept there too; changes need a short-lived token from a successful check.
// Older apps (and the web page) use the earlier in-page lock: salted PBKDF2 in its own storage key.
// Forgotten? Reset the app and restore a backup.
const LKEY = 'monthly-budget.lock';
const lockLocal = () => { try { return JSON.parse(localStorage.getItem(LKEY) || '{}') || {}; } catch (e) { return {}; } };
const lockSet = o => { try { localStorage.setItem(LKEY, JSON.stringify(o)); return true; } catch (e) { return false; } };
const NL = () => (BRIDGE && BRIDGE.lockStatus ? BRIDGE : null);
const nStat = () => { try { return JSON.parse(NL().lockStatus()) || {}; } catch (e) { return {}; } };
let curToken = '';
const lockGet = () => {
  const L = lockLocal(), n = NL(); if (!n) return L;

};
// save a lock setting (fingerprint, when to lock) where the lock lives
const setLockPref = (k, v) => {
  const L = lockLocal();
  if (NL() && nStat().on) { const r = String(NL().lockPrefs(JSON.stringify({ [k]: v }), curToken)); if (r !== 'ok') { toast("Couldn't change that. Confirm it's you again."); return false; } }
  L[k] = v; lockSet(L); return true;
};
const lockOffNow = () => {
  if (NL() && nStat().on && String(NL().lockOff(curToken)) !== 'ok') { toast("Couldn't turn the lock off. Confirm it's you again."); return false; }
  const L = lockLocal(); delete L.method; delete L.hash; delete L.salt; delete L.iter; L.bio = false; lockSet(L); curToken = ''; return true;
};
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
const randHex = n => { const a = new Uint8Array(n); crypto.getRandomValues(a); return hex(a.buffer); };

const ITER = 210000;
const LOCK_AFTER = [[0, 'Immediately'], [30, 'After 30 seconds'], [60, 'After 1 minute'], [300, 'After 5 minutes'], [900, 'After 15 minutes']];
const lockOn = () => { const L = lockGet(); return !!(L.method && L.hash); };

const lockWait = L => Math.max(0, (L.until || 0) - Date.now());

    if (r.startsWith('ok:')) { curToken = r.slice(3); return true; }
    return r.startsWith('wait:') ? 'wait' : false;
  }
  const L = lockLocal();
  if (lockWait(L)) return 'wait';
  if (method !== L.method || !L.hash) return false;
  const h = await kdf(method + ':' + secret, L.salt, L.iter || ITER);
  if (sameStr(h, L.hash)) {

      const v = String(n.lockVerify(method, String(secret))); if (v.startsWith('ok:')) curToken = v.slice(3);
      n.lockPrefs(JSON.stringify({ bio: !!L.bio, after: [0, 30, 60, 300, 900].includes(L.after) ? L.after : 60 }), curToken);
      const L2 = lockLocal(); delete L2.method; delete L2.hash; delete L2.salt; delete L2.iter; delete L2.fails; delete L2.until; lockSet(L2);

};
const storeSecret = async (method, secret) => {

    const r = String(n.lockSet(method, String(secret), curToken));
    if (r !== 'ok') return false;
    const v = String(n.lockVerify(method, String(secret))); if (v.startsWith('ok:')) curToken = v.slice(3);

const bindPattern = (id, onDone) => {
