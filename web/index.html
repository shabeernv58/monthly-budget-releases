<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06222e">
<title>Monthly Budget</title>
<style>@font-face{font-family:'Inter';font-weight:400;font-display:swap;src:url(fonts/inter-latin-400-normal.woff2) format('woff2')}@font-face{font-family:'Inter';font-weight:500;font-display:swap;src:url(fonts/inter-latin-500-normal.woff2) format('woff2')}@font-face{font-family:'Inter';font-weight:600;font-display:swap;src:url(fonts/inter-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'Space Grotesk';font-weight:500;font-display:swap;src:url(fonts/space-grotesk-latin-500-normal.woff2) format('woff2')}@font-face{font-family:'Space Grotesk';font-weight:600;font-display:swap;src:url(fonts/space-grotesk-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'Nunito';font-weight:400;font-display:swap;src:url(fonts/nunito-latin-400-normal.woff2) format('woff2')}@font-face{font-family:'Nunito';font-weight:600;font-display:swap;src:url(fonts/nunito-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'Lora';font-weight:400;font-display:swap;src:url(fonts/lora-latin-400-normal.woff2) format('woff2')}@font-face{font-family:'Lora';font-weight:600;font-display:swap;src:url(fonts/lora-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-weight:400;font-display:swap;src:url(fonts/barlow-condensed-latin-400-normal.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2')}</style>
<style>
/* VOICE: a quiet, exact money ledger you check in a 30-second glance
   IDEA: a bank passbook — one month per page, running balance down the margin
   PICTURE: the month's "left over" figure, large, over an income-vs-spent bar
   COLOUR and TYPE: ice ground, ink text, one hot pink for overspend/action; Space Grotesk figures + Inter
   LAYOUT: phone-first single column, sticky month bar, bottom tab bar, sheets slide up for edits */
:root{color-scheme:light dark;
--bg:light-dark(#dff1f7,#06222e);--card:light-dark(#fff,#0c3242);--ink:light-dark(#06222e,#e4f3f8);
--mut:light-dark(#4d6a74,#8db0bc);--line:light-dark(#c5e0ea,#1b4658);--acc:#ff2e7e;--ok:light-dark(#0b7a5c,#4fd1a5);
--soft:light-dark(#eef8fb,#0a2a37);--bar:light-dark(#06222e,#bfe6f2)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--fBody,Inter,system-ui,sans-serif);overflow-x:clip;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:600px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;margin:0 -16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.top h1{font:600 18px/1.2 var(--fNum,'Space Grotesk',sans-serif);margin:0;flex:1;text-align:center}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none}
.ib svg{width:20px;height:20px}
.num,.big{font-family:var(--fNum,'Space Grotesk',sans-serif);font-variant-numeric:tabular-nums;white-space:nowrap}
.hero{padding:22px 0 8px}
.hero .lab{color:var(--mut);font-size:14px}
.big{font-size:clamp(40px,12vw,56px);font-weight:600;line-height:1.05;letter-spacing:-.02em}
.big small{font-size:.38em;font-weight:500;color:var(--mut);margin-right:6px;letter-spacing:0}
.neg{color:var(--negc,#e0365f)}
.meter{height:14px;border-radius:7px;background:var(--line);overflow:hidden;margin:14px 0 6px;display:flex}
.meter i{display:block;height:100%;background:var(--bar)}
.meter i+i{background:var(--acc);opacity:.55}
.legend{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0}
.stat{background:var(--card);border-radius:14px;padding:12px 14px;border:1px solid var(--line)}
.stat b{display:block;font:600 20px/1.2 var(--fNum,'Space Grotesk',sans-serif);white-space:nowrap}
.stat span{font-size:13px;color:var(--mut)}
h2{font:600 15px/1.3 var(--fBody,Inter,sans-serif);margin:26px 0 8px;display:flex;align-items:center;gap:8px}
h2 .sp{flex:1}
h2 .num{font-size:15px;color:var(--mut)}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;min-height:56px;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.row:first-child{border-top:0}
.row:focus-visible,.ib:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row .t{flex:1;min-width:0}
.row .n{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{display:block;font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .a{text-align:right;flex:none}
.row .a .num{display:block;font-weight:600}
.row .a .s{text-align:right}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--soft);border:1px solid var(--line);color:var(--mut);margin-right:4px}
.chip.hot{color:var(--negc,#e0365f);border-color:var(--negc,#e0365f)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cchip{min-height:40px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:14px}
.cchip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cchip:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.stat b+span{display:block;font-size:12px;margin-top:2px}
.stat.wide{grid-column:1/-1}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:6px}
.seg button{flex:1;min-height:44px;border:0;background:var(--card);cursor:pointer;font-size:14px;padding:6px 4px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-checked=true]{background:var(--ink);color:var(--bg);font-weight:600}
.mlist{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 12px;margin-bottom:12px}
.mrow{display:flex;align-items:center;gap:10px;min-height:48px;border-top:1px solid var(--line)}
.mlist .mrow:first-child,#gMembers .mrow:first-child{border-top:0}
.mrow>span:first-child{flex:1}
.mrow input[type=number]{width:96px;min-height:40px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px;text-align:right}
#gMembers .mrow{border:0;min-height:0;margin-bottom:8px}
#gMembers input{flex:1;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:16px}
.shr{min-width:64px;text-align:right;color:var(--mut);font-size:14px}
.row .s.neg{color:var(--negc,#e0365f)}
.pdot{width:12px;height:12px;border-radius:50%;flex:none}
.filt{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.lsvg{display:block;width:100%;height:120px}
.flow{display:flex;align-items:flex-end;gap:5px;height:140px;padding:14px 14px 0}
.flow>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.flow .fb{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px}
.flow .fb i{display:block;width:45%;max-width:14px;border-radius:4px 4px 0 0;min-height:1px}
.flow i.d,.dot.d{background:var(--ok)}.flow i.w,.dot.w{background:var(--acc)}
.flow span{font-size:11px;color:var(--mut)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.calhd{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.calhd b{font:600 17px/1.2 var(--fNum,'Space Grotesk',sans-serif)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cwd{text-align:center;font-size:12px;color:var(--mut);padding:4px 0}
.cday{min-height:58px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;font-size:11px;overflow:hidden}
.cday b{font-size:13px;font-weight:600}
.cday span{font-family:var(--fNum,'Space Grotesk',sans-serif);white-space:nowrap;max-width:100%;overflow:hidden}
.cday .d{color:var(--ok)}.cday .w{color:var(--acc)}
.cday.now{border-color:var(--ink)}.cday.sel{outline:2px solid var(--acc);outline-offset:1px}
.mkb{width:22px;height:22px;border-radius:50%;flex:none;border:2px solid var(--pendC,#e0565b);display:grid;place-items:center;cursor:pointer;position:relative}
.mkb::after{content:'';position:absolute;inset:-11px}
.st-done .mkb{background:var(--doneC,#2e9e6b);border-color:var(--doneC,#2e9e6b)}
.st-done .mkb::before{content:'';width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
[data-mark=block] .row.st-done{background:color-mix(in srgb,var(--doneC) 13%,var(--card))}
[data-mark=block] .row.st-pend{background:color-mix(in srgb,var(--pendC) 10%,var(--card))}
[data-mark=strike] .row.st-done .n,[data-mark=strike] .row.st-done .a .num{text-decoration:line-through;text-decoration-color:var(--doneC);text-decoration-thickness:2px}
[data-mark=strike] .row.st-pend .mkb{border-color:var(--line)}
[data-mark=edge] .row.st-done{box-shadow:inset 5px 0 0 var(--doneC)}
[data-mark=edge] .row.st-pend{box-shadow:inset 5px 0 0 var(--pendC)}
.row.dim{opacity:.55}
table.pva{width:100%;border-collapse:collapse;font-size:14px}
table.pva th,table.pva td{padding:10px 12px;text-align:right;border-top:1px solid var(--line)}
table.pva th{font-weight:500;color:var(--mut);border-top:0}
table.pva td:first-child,table.pva th:first-child{text-align:left}
.tokbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;line-height:2.3;margin-bottom:12px;font-size:15px}
.tok{border:1px solid transparent;background:none;padding:3px 5px;border-radius:8px;cursor:pointer;font:inherit;color:inherit;min-height:34px}
.tok:hover{border-color:var(--line)}
.tok.on{color:#fff;font-weight:600}
.tok.tf-amount,.tok.tf-total,.cchip.tf-amount[aria-pressed=true],.cchip.tf-total[aria-pressed=true]{background:#0b7a5c;border-color:#0b7a5c;color:#fff}
.tok.tf-merchant,.cchip.tf-merchant[aria-pressed=true]{background:#2f6fd6;border-color:#2f6fd6;color:#fff}
.tok.tf-due,.cchip.tf-due[aria-pressed=true]{background:#d61862;border-color:#d61862;color:#fff}
.tok.tf-min,.cchip.tf-min[aria-pressed=true]{background:#b7791f;border-color:#b7791f;color:#fff}
.tok.tf-card,.cchip.tf-card[aria-pressed=true]{background:#7a4fd1;border-color:#7a4fd1;color:#fff}
details.hidden-list{margin-top:14px}details.hidden-list summary{cursor:pointer;min-height:44px;display:flex;align-items:center}
.ic{width:18px;height:18px;flex:none}
nav.tabs a .ic{width:22px;height:22px}
[data-icons=filled] nav.tabs a[aria-current=page] .ic path{fill:currentColor;fill-opacity:.22}
[data-icons=bold] nav.tabs a .ic{stroke-width:2.8}
.cchip2{display:inline-flex;align-items:center;gap:4px;color:var(--cc);border-color:color-mix(in srgb,var(--cc) 40%,transparent);background:color-mix(in srgb,var(--cc) 10%,var(--card))}
.cchip2 .ic{width:13px;height:13px}
.cico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--cc);background:color-mix(in srgb,var(--cc) 14%,var(--card));flex:none}
.icgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.icgrid button{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icgrid button[aria-checked=true]{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc);color:var(--acc)}
.icgrid.small{grid-template-columns:repeat(7,minmax(0,1fr))}
.colgrid{display:flex;flex-wrap:wrap;gap:10px}
.colgrid button{width:36px;height:36px;border-radius:50%;border:3px solid var(--card);cursor:pointer;box-shadow:0 0 0 1px var(--line)}
.colgrid button[aria-checked=true]{box-shadow:0 0 0 3px var(--ink)}
.dd{position:relative}
.ddbtn{width:100%;min-height:46px;padding:6px 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:8px;cursor:pointer;text-align:left}
.ddval{flex:1;display:flex;flex-wrap:wrap;gap:4px}
.ddlist{margin-top:6px;border:1px solid var(--line);border-radius:12px;background:var(--card);max-height:300px;overflow:auto;padding:4px}
.ddopt{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 8px;cursor:pointer;border-radius:8px}
.ddopt input{width:20px;height:20px;accent-color:var(--acc)}
.ddopt .cico{width:28px;height:28px}
.ddrow{display:flex;gap:6px;align-items:stretch}.ddrow .ddbtn{flex:1}.ddedit{width:46px;min-height:46px;border-radius:12px;flex:none}.ddedit svg{width:20px;height:20px}
.ddnew{width:100%;min-height:44px;border:0;background:none;color:var(--acc);font-weight:600;cursor:pointer;text-align:left;padding:0 10px}
.ddadd{display:flex;gap:8px;padding:6px}
.ddadd input{flex:1;min-height:40px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px}
[data-compact='1'] .row{min-height:44px;padding-top:7px;padding-bottom:7px}
[data-compact='1'] .stat{padding:9px 12px}
[data-compact='1'] h2{margin-top:18px}
[data-corners=square] .list,[data-corners=square] .stat,[data-corners=square] .btn,[data-corners=square] .sheet,[data-corners=square] .banner,[data-corners=square] .ib,[data-corners=square] .f input,[data-corners=square] .f select,[data-corners=square] .f textarea,[data-corners=square] .ddbtn,[data-corners=square] .ddlist,[data-corners=square] .fab,[data-corners=square] .fab2,[data-corners=square] .seg,[data-corners=square] .cday,[data-corners=square] .tokbox{border-radius:4px}
.note-ic{color:var(--mut);font-size:13px}
.empty{padding:22px 16px;text-align:center;color:var(--mut)}
.btn{min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:500}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.hot{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.fab2{position:fixed;right:max(16px,calc(50% - 284px));bottom:calc(158px + env(safe-area-inset-bottom));min-height:44px;padding:0 14px;border-radius:14px;background:var(--card);color:var(--ink);border:1px solid var(--line);display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;text-decoration:none;box-shadow:0 6px 18px rgba(6,34,46,.15);z-index:6}
.fab2 svg{width:20px;height:20px;color:var(--acc)}
.fab{position:fixed;right:max(16px,calc(50% - 284px));bottom:calc(88px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:18px;background:var(--acc);color:#fff;border:0;font-size:30px;box-shadow:0 8px 24px rgba(255,46,126,.35);cursor:pointer;z-index:6}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:12px;color:var(--mut);text-decoration:none;min-height:56px}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current=page]{color:var(--ink);font-weight:600}
nav.tabs a[aria-current=page] svg{color:var(--acc)}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--ok)}
.bars .r{padding:10px 14px;border-top:1px solid var(--line)}
.bars .r:first-child{border-top:0}
.bars .h{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.bars .track{height:10px;border-radius:5px;background:var(--line);margin-top:6px;position:relative;overflow:hidden}
.bars .track i{position:absolute;left:0;top:0;bottom:0;background:var(--bar);border-radius:5px}
.bars .track i.over{background:var(--negc,#e0365f)}
.trend{display:flex;align-items:flex-end;gap:6px;height:150px;padding:14px 14px 0}
.trend div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.trend i{display:block;width:100%;max-width:38px;background:var(--bar);border-radius:6px 6px 0 0;min-height:2px}
.trend i.cur{background:var(--acc)}
.trend span{font-size:11px;color:var(--mut)}
.trendlab{display:flex;gap:6px;padding:4px 14px 12px}
.trendlab span{flex:1;text-align:center;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden}
.banner{background:var(--card);border:1px solid var(--acc);border-radius:14px;padding:12px 14px;margin:14px 0;font-size:14px}
.muted{color:var(--mut);font-size:14px}
.banner a{color:var(--acc);font-weight:600}
/* sheet */
.veil{position:fixed;inset:0;background:rgba(3,20,28,.55);z-index:20;display:none;align-items:flex-end;justify-content:center}
.veil.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h3{font:600 20px/1.2 var(--fNum,'Space Grotesk',sans-serif);margin:0 0 14px}
.f{display:block;margin:0 0 12px}
.f>span{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
.f input:not([type=checkbox]):not([type=radio]),.f select,.f textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:16px}
.f textarea{min-height:90px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--acc);outline-offset:1px}
.ck{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.ck input{width:20px;height:20px;accent-color:var(--acc)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;z-index:30;display:none;gap:12px;align-items:center;font-size:14px;max-width:92vw}
.toast.on{display:flex}
.toast button{background:none;border:0;color:var(--acc);font-weight:600;cursor:pointer;min-height:32px}
.imp td,.imp th{padding:6px 4px;font-size:14px;text-align:left;vertical-align:middle}
.imp input[type=month]{min-height:40px;padding:4px 8px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:15px;max-width:150px}
.imp .r{text-align:right;white-space:nowrap}
pre.note{white-space:pre-wrap;font:14px/1.45 var(--fBody,Inter,sans-serif);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 12px}

body.locked>*:not(#lockscr){visibility:hidden}
#tabs a{position:relative}.tbadge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--negc,#e0365f);color:#fff;font:700 11px/18px var(--fNum,inherit);text-align:center}

<script>
/* Budget workbook importer: reads the monthly-sheet layout into plain objects. */
const BudgetImport = (() => {
  const MONTHS = ['january','february','march','april','may','june','july','august','september','october','november','december'];
  const norm = s => String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
  const up = s => norm(s).toUpperCase();
  const monthIdx = s => {
    const t = norm(s).toLowerCase();
    if (!t) return -1;
    const i = MONTHS.indexOf(t);
    if (i >= 0) return i;
    return MONTHS.findIndex(m => t === m.slice(0, 3) || t === m.slice(0, 4));
  };
  const monthInName = name => {
    const words = String(name).toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
    for (let k = 0; k < words.length; k++) {
      const i = monthIdx(words[k]);
      if (i >= 0) {
        const yy = words[k + 1] && /^\d{2}$/.test(words[k + 1]) ? 2000 + Number(words[k + 1]) : null;
        return { m: i, yy };
      }
    }
    return null;
  };
  const cleanComment = c => {
    if (!c || !c.length) return '';
    return c.map(x => {
      let t = String(x.t || '');
      if (/\[Threaded comment\]/.test(t)) {
        const i = t.indexOf('Comment:');
        t = i >= 0 ? t.slice(i + 8) : '';
      }
      return t.replace(/\r/g, '').split('\n').map(l => l.trim())
        .filter(l => l && !/^Reply:?$/i.test(l)).join('\n');
    }).filter(Boolean).join('\n').trim();
  };

  function parseSheet(XLSX, ws, name) {
    if (!ws || !ws['!ref']) return null;
    const R = XLSX.utils.decode_range(ws['!ref']);
    const cell = (r, c) => ws[XLSX.utils.encode_cell({ r, c })];
    const val = (r, c) => { const x = cell(r, c); return x ? x.v : undefined; };
    const num = (r, c) => { const v = val(r, c); return typeof v === 'number' && isFinite(v) ? v : null; };
    const txt = (r, c) => { const v = val(r, c); return typeof v === 'string' ? norm(v) : ''; };
    const note = (r, c0, c1) => {
      const out = [];
      for (let c = c0; c <= c1; c++) { const x = cell(r, c); if (x && x.c) { const t = cleanComment(x.c); if (t) out.push(t); } }
      return out.join('\n');
    };
    const findRow = (pred, r0 = R.s.r, r1 = R.e.r) => {
      for (let r = r0; r <= r1; r++) for (let c = R.s.c; c <= R.e.c; c++) if (pred(up(val(r, c)), r, c)) return { r, c };
      return null;
    };

    // month + year from the header block
    let month = -1, year = null;
    for (let r = 0; r <= Math.min(3, R.e.r); r++) for (let c = 0; c <= Math.min(6, R.e.c); c++) {
      const v = val(r, c);
      if (month < 0 && typeof v === 'string' && monthIdx(v) >= 0 && norm(v).length > 2) month = monthIdx(v);
      if (up(v) === 'YEAR') for (let k = c + 1; k <= c + 4; k++) { const n = num(r, k); if (n && n > 2000 && n < 2100) { year = n; break; } }
    }
    const fromName = monthInName(name);

    // expense table
    const hdr = findRow(t => t === 'AMOUNT USED');
    if (!hdr) return null;
    const colUsed = hdr.c;
    let colDesc = 0, colPending = -1;
    for (let c = 0; c < colUsed; c++) {
      const t = up(val(hdr.r, c));
      if (/D[EI]SCRIPTION/.test(t)) colDesc = c;
      if (/NOT YET DEBITED/.test(t)) colPending = c;
    }

    const incomes = [];
    for (let r = R.s.r; r < hdr.r; r++) {
      const label = norm(val(r, colDesc));
      if (!label || /^(MONTH|YEAR|MONTHLY EXPENSE)/i.test(label) || typeof val(r, colDesc) !== 'string') continue;
      let amt = null;
      for (let c = colDesc + 1; c <= colDesc + 4; c++) { const n = num(r, c); if (n !== null) { amt = n; break; } }
      if (amt === null) continue;
      incomes.push({ name: label.replace(/\s*-\s*[A-Za-z]+$/, '').trim() || label, label, amount: amt, note: note(r, colDesc, colDesc + 4) });
    }

    const expenses = [];
    let r = hdr.r + 1;
    for (; r <= R.e.r; r++) {
      const label = txt(r, colDesc);
      if (/^TOTAL AMOUNT USED/i.test(label)) break;
      const used = num(r, colUsed), pend = colPending >= 0 ? num(r, colPending) : null;
      const n = note(r, colDesc, colUsed + 2);
      if (!label && used === null && pend === null) continue;
      if (!used && !pend && !n) continue;
      expenses.push({ name: label || 'Unnamed', amount: used || 0, pending: pend || 0, note: n });
    }
    const carry = { prevSavings: 0, cashInHand: 0, extraCash: 0, notes: {} };
    for (; r <= R.e.r; r++) {
      const label = txt(r, colDesc).toLowerCase();
      let key = null;
      if (/savings from previous/.test(label)) key = 'prevSavings';
      else if (/cash in hand/.test(label)) key = 'cashInHand';
      else if (/(extra )?cash in account/.test(label)) key = 'extraCash';
      if (!key) continue;
      for (let c = colDesc + 1; c <= colDesc + 3; c++) { const v = num(r, c); if (v !== null) { carry[key] = v; break; } }
      const nn = note(r, colDesc, colDesc + 3); if (nn) carry.notes[key] = nn;
    }

    // liabilities table
    const liabilities = [], family = [];
    let inrRate = null, inrRows = null;
    for (const addr in ws) {
      if (addr[0] === '!') continue;
      const f = ws[addr].f;
      const m = f && /SUM\(\(([A-Z]+)(\d+):([A-Z]+)(\d+)\)\/([A-Z]+)(\d+)\)/i.exec(f);
      if (m) {
        inrRows = [Number(m[2]) - 1, Number(m[4]) - 1];
        const rc = XLSX.utils.decode_cell(m[5] + m[6]);
        inrRate = num(rc.r, rc.c);
      }
    }
    const lh = findRow(t => t === 'TOTAL AMOUNT', R.s.r, Math.min(R.e.r, 12));
    if (lh) {
      const col = {};
      for (let c = lh.c - 1; c <= Math.min(R.e.c, lh.c + 8); c++) {
        const t = up(val(lh.r, c));
        if (/D[EI]SCRIPTION/.test(t)) col.desc = c;
        else if (t === 'TOTAL AMOUNT') col.total = c;
        else if (/AMOUNT PAID/.test(t)) col.paid = c;
        else if (t === 'EMI') col.emi = c;
        else if (t === 'PAYMENTS') col.count = c;
        else if (/TOTAL TENURE/.test(t)) col.tenure = c;
      }
      if (col.desc === undefined) col.desc = lh.c - 1;
      let afterTotal = false;
      for (let rr = lh.r + 1; rr <= Math.min(R.e.r, lh.r + 45); rr++) {
        let rowText = '';
        for (let c = col.desc; c <= col.desc + 8; c++) rowText += ' ' + up(val(rr, c));
        if (/TOTAL BALANCE/.test(rowText)) { afterTotal = true; continue; }
        if (/^CAR PURCHASE|^DISCRIPTION/.test(txt(rr, col.desc).toUpperCase())) break;
        const label = txt(rr, col.desc), principal = num(rr, col.total);
        if (!label || principal === null) continue;
        const paid = col.paid !== undefined ? num(rr, col.paid) : null;
        const emi = col.emi !== undefined ? num(rr, col.emi) : null;
        const count = col.count !== undefined ? num(rr, col.count) : null;
        const tenure = col.tenure !== undefined ? num(rr, col.tenure) : null;
        const n = note(rr, col.desc, col.desc + 7);
        const inr = !!(inrRows && rr >= inrRows[0] && rr <= inrRows[1]);
        const isFamily = afterTotal || /credit (taken )?(from|with)|cash given|cash need|borrow/i.test(label);
        if (isFamily) {
          const pm = /(?:by|to|from|with)\s+([A-Z][a-zA-Z]+)/.exec(label);
          family.push({ label, person: pm ? pm[1] : '', amount: principal - (paid || 0) - (emi || 0) * (count || 0), note: n, inr });
        } else {
          liabilities.push({ name: label, principal, openingPaid: paid !== null ? paid : (emi || 0) * (count || 0), emi: emi || 0, count: count || 0, tenure: tenure || 0, currency: inr ? 'INR' : 'AED', note: n });
        }
      }
    }
    return { name, month, year, fromName, incomes, expenses, carry, liabilities, family, inrRate };
  }

  function parse(XLSX, wb) {
    const sheets = wb.SheetNames.map(n => { try { return parseSheet(XLSX, wb.Sheets[n], n); } catch (e) { return null; } }).filter(Boolean);
    // suggest a YYYY-MM per sheet: month from header (or name), years increasing through the workbook
    // pass 1: relative year offsets along the ticked sequence
    let off = 0, prev = -1, base = null, baseFromYear = null;
    for (const s of sheets) {
      s.m = s.month >= 0 ? s.month : (s.fromName ? s.fromName.m : -1);
      s.suggestOn = !!s.fromName && !/sample/i.test(s.name) && s.m >= 0;
      if (!s.suggestOn) continue;
      if (prev >= 0 && s.m <= prev) off++;
      prev = s.m; s.off = off;
      if (base === null && s.fromName.yy) base = s.fromName.yy - off;        // "Dec 26" in the name wins
      if (baseFromYear === null && s.year) baseFromYear = s.year - off;
    }
    if (base === null) base = baseFromYear !== null ? baseFromYear : new Date().getFullYear();
    for (const s of sheets) {
      if (s.m < 0) { s.key = ''; continue; }
      const y = s.suggestOn ? base + s.off : (s.year || base);
      s.key = y + '-' + String(s.m + 1).padStart(2, '0');
    }
    // same month twice: keep the later sheet ticked
    const seen = {};
    for (let i = sheets.length - 1; i >= 0; i--) {
      const s = sheets[i];
      if (!s.suggestOn) continue;
      if (seen[s.key]) s.suggestOn = false; else seen[s.key] = 1;
    }
    return sheets;
  }
  return { parse, MONTHS };
})();
if (typeof module !== 'undefined') module.exports = BudgetImport;

</script>
<script>
{
const KEY = 'monthly-budget.v1';
const BRIDGE = window.AndroidBridge || null, IS_APP = !!BRIDGE;
const CATS = []; // filled from your categories (Settings › Categories)
const CAT_RULES = [
  [/saving|invest|emergency|vacation/i,'Savings'],
  [/rent|room rent|upfron|deposit|ejari|agency/i,'Housing'],
  [/emi|loan|credit card|card|tabby|advance salary|mashre|tamara/i,'Loans & EMIs'],
  [/dewa|wifi|internet|gas|solar|du |etisalat|bill$/i,'Utilities'],
  [/home|family|remit|parents|wife|husband/i,'Family support'],
  [/grocer|shopping|supermarket/i,'Groceries'],
  [/dining|restaurant|food/i,'Dining out'],
  [/fuel|rta|nol|travel|taxi|car |salik|parking/i,'Transport'],
  [/nebosh|course|exam|equival|fees|study/i,'Education'],
  [/personal|misc|extra|atm/i,'Personal']
];
const guessCat = n => { for (const [re,c] of CAT_RULES) if (re.test(n)) return c; return 'Other'; };
// an expense can carry several categories; x.cat stays as the first one for older data
const catsOf = x => (Array.isArray(x.cats) && x.cats.length) ? x.cats : [x.cat || 'Other'];
const hasCat = (x, c) => catsOf(x).includes(c);
const EMI_CAT = 'Loans & EMIs';
const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const fmt = n => (Number(n) || 0).toLocaleString('en-US', { maximumFractionDigits: (typeof S !== 'undefined' && S.settings && S.settings.look && S.settings.look.cents === false) ? 0 : 2, minimumFractionDigits: 0 });
const fmtPlain = n => fmt(n); // for amounts already in their own currency
const sum = (a, f) => a.reduce((t, x) => t + (Number(f ? f(x) : x) || 0), 0);
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const today = () => ymd(new Date());
const calKey = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
// ---------- tracking months: "the month starts on day N" ----------
// With N = 27, December runs from 27 Nov to 26 Dec. With N = 1 it's the calendar month.
const TRK = () => { let t = {}; try { t = (S && S.settings && S.settings.track) || {}; } catch (e) {} return Object.assign({ startDay: 27, salaryNext: true }, t); };
const startDay = () => Math.min(28, Math.max(1, Math.round(+TRK().startDay || 1)));
const periodOf = d => { if (!d || !/^\d{4}-\d{2}-\d{2}/.test(d)) return calKey(); const k = d.slice(0, 7), sd = startDay(); return sd > 1 && +d.slice(8, 10) >= sd ? addM(k, 1) : k; };
const periodStart = k => { const sd = startDay(); return sd === 1 ? k + '-01' : addM(k, -1) + '-' + String(sd).padStart(2, '0'); };
const periodEnd = k => { const d = new Date(periodStart(addM(k, 1)) + 'T00:00'); d.setDate(d.getDate() - 1); return ymd(d); };
const nowKey = () => periodOf(today());
const mLabel = k => { if (!k) return ''; const [y, m] = k.split('-'); return MN[+m - 1] + ' ' + y; };
const mLong = k => { const [y, m] = k.split('-'); return BudgetImport.MONTHS[+m - 1].replace(/^./, c => c.toUpperCase()) + ' ' + y; };
const addM = (k, d) => { let [y, m] = k.split('-').map(Number); m += d; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return y + '-' + String(m).padStart(2, '0'); };

// ---------- state ----------
const blank = () => ({ settings: { inrRate: 23.8, rates: {} }, months: {}, loans: [], family: [], groups: [], savings: { pots: [], entries: [], hide: false }, act: null, budgets: {}, lastBackup: 0 });
let S = blank(), storageOK = true, undoSnap = null;
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch (e) { storageOK = false; }
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; } catch (e) { storageOK = false; } if (window.__notesSoon) window.__notesSoon(); };
const snap = () => { undoSnap = JSON.stringify(S); };
let cur = (() => { const ks = Object.keys(S.months).sort(); const n = nowKey(); if (S.months[n]) return n; const past = ks.filter(k => k <= n); return past.pop() || ks.pop() || n; })();

// ---------- maths ----------
const monthCalc = m => {
  const income = sum(m.incomes, x => x.amount), used = sum(m.expenses, x => x.amount), pending = sum(m.expenses, x => x.pending);
  const left = income - used, c = m.carry || {};
  const cash = left + (+c.prevSavings || 0) + (+c.cashInHand || 0) + (+c.extraCash || 0);
  const saved = sum(m.expenses.filter(x => hasCat(x, 'Savings')), x => x.amount);
  const emi = sum(m.expenses.filter(x => hasCat(x, EMI_CAT)), x => x.amount);
  const emiLines = m.expenses.filter(x => hasCat(x, EMI_CAT)).length;
  return { income, used, pending, left, cash, saved, emi, emiLines };
};
const toAED = (amt, cur) => cur === 'INR' ? amt / (S.settings.inrRate || 1) : amt;
const loanCalc = l => {
  const paid = (+l.openingPaid || 0) + sum(l.payments || [], p => p.amount);
  const count = (+l.openingCount || 0) + (l.payments || []).filter(p => p.emi).length;
  const balance = (+l.principal || 0) - paid;
  const left = l.tenure ? Math.max(0, l.tenure - count) : null;
  const pct = l.principal ? Math.min(100, Math.max(0, paid / l.principal * 100)) : 0;
  return { paid, count, balance, left, pct, aed: toAED(Math.max(0, balance), l.currency), done: balance <= 0.5 || (left === 0 && l.tenure) };
};
const totals = () => {
  const active = S.loans.filter(l => !l.closed);
  const debt = sum(active, l => loanCalc(l).aed);
  const emi = sum(active.filter(l => !loanCalc(l).done), l => toAED(+l.emi || 0, l.currency));
  const d = ffDebts(), owe = d.oweAED, owed = d.owedAED;
  return { debt, emi, owe, owed };
};
const endsOn = (l, c) => { if (c.left == null || !c.left) return ''; return mLabel(addM(nowKey(), c.left - 1)); };

// ---------- ui helpers ----------
const toast = (msg, undo) => {
  $('#toastMsg').textContent = msg; $('#toastUndo').style.display = undo ? '' : 'none';
  $('#toast').classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => $('#toast').classList.remove('on'), 5000);
};
$('#toastUndo').onclick = () => { if (undoSnap) { S = JSON.parse(undoSnap); undoSnap = null; save(); render(); toast('Restored'); } };
const closeSheet = () => { $('#veil').classList.remove('on'); $('#sheet').innerHTML = ''; };
$('#veil').addEventListener('click', e => { if (e.target.id === 'veil') closeSheet(); });
$('#veil2').addEventListener('click', e => { if (e.target.id === 'veil2') closeCats(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
/* fields: {k,label,type,value,options,step,half} -> calls onSave(values) */
const form = (title, fields, onSave, opts = {}) => {
  const fh = f => {
    const id = 'f_' + f.k, v = f.value == null ? '' : f.value;
    if (f.type === 'checkbox') return `<label class="ck"><input type="checkbox" id="${id}" ${v ? 'checked' : ''}> ${esc(f.label)}</label>`;
    if (f.type === 'html') return f.html;
    if (f.type === 'catpick' || f.type === 'catpick1') return catPickHTML(id, Array.isArray(v) ? v : (v ? [v] : []), f.type === 'catpick', f.label);
    if (f.type === 'chips') return `<div class="f"><span>${esc(f.label)}</span><div class="chips" id="${id}" role="group" aria-label="${esc(f.label)}">${f.options.map(o => `<button type="button" class="cchip" data-v="${esc(o)}" aria-pressed="${(v || []).includes(o)}">${esc(o)}</button>`).join('')}</div></div>`;
    let inp;

// ---------- family & friends: shared-expense groups (Splid-style) ----------
// Works on its own: nothing here touches the Month, Loans or Budget data.
// Money is held in whole cents of the group's currency so balances always add up to zero.
const BASE_RATES = { AED: 1, USD: 0.2723, SAR: 1.0211, QAR: 0.9912, OMR: 0.1047, BHD: 0.1024 };
const rates = () => Object.assign({}, BASE_RATES, S.settings.rates || {}, { AED: 1, INR: +S.settings.inrRate || 23.8 });
const conv = (amt, from, to) => { if (from === to) return amt; const r = rates(); return amt / (r[from] || 1) * (r[to] || 1); };
const C = n => Math.round((Number(n) || 0) * 100);           // to cents
const U = c => c / 100;                                       // from cents
let ffGroup = null;                                           // open group id, or null for the overview

const gById = id => S.groups.find(g => g.id === id);
const meId = g => (g.members.find(m => m.me) || g.members[0] || {}).id;
const mName = (g, id) => (g.members.find(m => m.id === id) || {}).name || 'Removed member';
const newGroup = (name, currency) => ({ id: uid(), name, currency: currency || 'AED', members: [{ id: uid(), name: 'Me', me: true }], entries: [], archived: false, created: today() });
const gAmt = (g, e) => e.currency === g.currency ? +e.amount : (+e.amount) / (+e.fx || conv(1, g.currency, e.currency)); // entry -> group currency

// split `total` cents across weights so the parts add up exactly (largest remainder)
const allocate = (total, weights) => {
  const ids = Object.keys(weights).filter(id => weights[id] > 0);
  const W = ids.reduce((t, id) => t + weights[id], 0);
  const out = {}; if (!W) return out;
  let used = 0;
  const rem = ids.map(id => { const exact = total * weights[id] / W; const fl = Math.floor(exact); out[id] = fl; used += fl; return [id, exact - fl]; });
  rem.sort((a, b) => b[1] - a[1]);
  for (let i = 0; i < total - used; i++) out[rem[i % rem.length][0]]++;
  return out;
};
// who carries how much of an expense or income, in group cents
const shareOf = (g, e) => {
  const total = C(gAmt(g, e)), sp = e.split || { mode: 'equal', parts: {} }, w = {};
  for (const id in sp.parts) { const v = +sp.parts[id] || 0; if (v > 0) w[id] = sp.mode === 'equal' ? 1 : v; }
  return allocate(total, w);
};
const paidOf = (g, e) => {
  const total = C(gAmt(g, e)), w = {};
  (e.payers || []).forEach(p => { if (+p.amt > 0) w[p.m] = (w[p.m] || 0) + +p.amt; });
  return allocate(total, w);
};
// balance per member (cents): positive = the group owes them, negative = they owe the group
const groupCalc = g => {
  const bal = {}, paid = {}, share = {};
  g.members.forEach(m => { bal[m.id] = 0; paid[m.id] = 0; share[m.id] = 0; });
  const add = (o, id, v) => { o[id] = (o[id] || 0) + v; };
  let spent = 0;
  for (const e of g.entries) {
    if (e.type === 'transfer') { const a = C(gAmt(g, e)); add(bal, e.from, a); add(bal, e.to, -a); continue; }
    const sh = shareOf(g, e), pd = paidOf(g, e), sign = e.type === 'income' ? -1 : 1;
    for (const id in pd) { add(bal, id, sign * pd[id]); if (sign > 0) add(paid, id, pd[id]); }
    for (const id in sh) { add(bal, id, -sign * sh[id]); add(share, id, sign * sh[id]); }
    spent += sign * C(gAmt(g, e));
  }
  return { bal, paid, share, spent, plan: settlePlan(bal) };
};
// fewest payments that clear every balance
const settlePlan = bal => {
  const cr = [], db = [];
  for (const id in bal) { if (bal[id] > 0) cr.push([id, bal[id]]); else if (bal[id] < 0) db.push([id, -bal[id]]); }
  cr.sort((a, b) => b[1] - a[1]); db.sort((a, b) => b[1] - a[1]);
  const out = []; let i = 0, j = 0;
  while (i < db.length && j < cr.length) {
    const x = Math.min(db[i][1], cr[j][1]);
    if (x > 0) out.push({ from: db[i][0], to: cr[j][0], amt: x });
    db[i][1] -= x; cr[j][1] -= x;
    if (!db[i][1]) i++; if (!cr[j][1]) j++;
  }
  return out;
};
// across all open groups, what I owe and what I'm owed, person by person
const ffDebts = () => {
  const owe = [], owed = [];
  for (const g of S.groups) {
    if (g.archived) continue;
    const me = meId(g), { plan } = groupCalc(g);
    plan.forEach(p => {
      const row = { g, amt: U(p.amt), aed: conv(U(p.amt), g.currency, 'AED') };
      if (p.from === me) owe.push(Object.assign(row, { who: mName(g, p.to) }));
      if (p.to === me) owed.push(Object.assign(row, { who: mName(g, p.from) }));
    });
  }
  return { owe, owed, oweAED: sum(owe, x => x.aed), owedAED: sum(owed, x => x.aed) };
};

// old one-person-at-a-time family entries become transfers, one group per person
// (separate groups so one person's debt is never netted against someone else's)
const migrateFamily = list => {
  if (!list || !list.length) return;
  const groupFor = name => {
    const nm = String(name || 'Unknown').trim() || 'Unknown';
    let g = S.groups.find(x => x.members.length === 2 && x.members.some(m => !m.me && m.name.toLowerCase() === nm.toLowerCase()));
    if (!g) { g = newGroup(nm, 'AED'); g.members.push({ id: uid(), name: nm }); S.groups.push(g); }
    return g;
  };
  for (const f of list) {
    const g = groupFor(f.person), me = meId(g), p = g.members.find(m => !m.me).id;
    const cur = f.currency || 'AED', fx = cur === 'AED' ? 1 : conv(1, 'AED', cur);
    const iOwe = f.dir !== 'owed';
    g.entries.push({ id: uid(), type: 'transfer', title: f.label || (iOwe ? 'Borrowed' : 'Lent'), amount: +f.amount || 0, currency: cur, fx, date: f.date || today(), from: iOwe ? p : me, to: iOwe ? me : p, note: f.note || '' });
    (f.repay || []).forEach(r => g.entries.push({ id: uid(), type: 'transfer', title: 'Repayment', amount: +r.amount || 0, currency: cur, fx, date: r.date || today(), from: iOwe ? me : p, to: iOwe ? p : me, note: r.note || '' }));
  }
};

const POT_COLORS = [['Green', '#0b7a5c'], ['Blue', '#2f6fd6'], ['Pink', '#ff2e7e'], ['Gold', '#b7791f'], ['Purple', '#7a4fd1'], ['Ink', '#06222e']];
const potById = id => SV().pots.find(p => p.id === id);
const potName = id => (potById(id) || {}).name || 'Deleted pot';
const hv = s => SV().hide ? '••••' : s;
const monthsBetween = (a, b) => { const [ya, ma] = a.split('-').map(Number), [yb, mb] = b.split('-').map(Number); return (yb - ya) * 12 + (mb - ma); };
const lastDay = key => { const [y, m] = key.split('-').map(Number); return key + '-' + String(new Date(y, m, 0).getDate()).padStart(2, '0'); };
const fmtDay = d => new Date(d + 'T00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });

// effect of one entry on one pot, in that pot's currency
const effOn = (e, potId) => {
  if (e.type === 'move') return (e.pot === potId ? -(+e.amount) : 0) + (e.toPot === potId ? +(e.toAmount != null && e.toAmount !== '' ? e.toAmount : e.amount) : 0);
  if (e.pot !== potId) return 0;
  return e.type === 'dep' ? +e.amount : -(+e.amount);
};
// deposits and withdrawals in AED (moves between pots are neither)
const entryAED = e => { const p = potById(e.pot); return conv(+e.amount, p ? p.currency : 'AED', 'AED'); };
const potCalc = p => {
  let dep = 0, wd = 0, mvIn = 0, mvOut = 0, first = null, open = 0;
  for (const e of SV().entries) {
    if (e.pot !== p.id && e.toPot !== p.id) continue;
    if (!first || e.date < first) first = e.date;
    if (e.type === 'move') { if (e.pot === p.id) mvOut += +e.amount; if (e.toPot === p.id) mvIn += +(e.toAmount != null && e.toAmount !== '' ? e.toAmount : e.amount); }
    else if (e.type === 'dep') { dep += +e.amount; if (e.opening) open += +e.amount; } else wd += +e.amount;
  }
  const bal = r2(dep - wd - mvOut + mvIn), target = +p.target || 0;
  const pct = p.kind === 'goal' && target ? Math.max(0, Math.min(100, bal / target * 100)) : null;
  let perMonth = null, monthsLeft = null;
  if (p.kind === 'goal' && target && p.targetDate && p.targetDate > today()) {
    monthsLeft = Math.max(1, Math.ceil((new Date(p.targetDate) - new Date(today())) / (30.44 * 864e5)));
    perMonth = Math.max(0, (target - bal) / monthsLeft);
  }
  const months = first ? Math.max(1, monthsBetween(first.slice(0, 7), today().slice(0, 7)) + 1) : 1;
  return { dep, wd, mvIn, mvOut, bal, target, pct, perMonth, monthsLeft, avg: (dep - open - wd) / months, first, open };
};
const totalSavingsAED = () => sum(SV().pots.filter(p => !p.archived), p => conv(potCalc(p).bal, p.currency, 'AED'));

// date ranges for filters and statistics
const periodRange = (kind, off = 0) => {
  const t = today();
  if (kind === 'week') {
    const d = new Date(t + 'T00:00'); d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + off * 7);
    const e = new Date(d); e.setDate(d.getDate() + 6);
    const from = ymd(d), to = ymd(e);
    return { from, to, label: `${d.getDate()} ${MN[d.getMonth()]} – ${e.getDate()} ${MN[e.getMonth()]} ${e.getFullYear()}` };
  }
  if (kind === 'month') { const k = addM(t.slice(0, 7), off); return { from: k + '-01', to: lastDay(k), label: mLong(k) }; }
  if (kind === 'year') { const y = +t.slice(0, 4) + off; return { from: y + '-01-01', to: y + '-12-31', label: String(y) }; }
  return { from: '0000-01-01', to: '9999-12-31', label: 'All time' };
};
const inRange = (e, r) => e.date >= r.from && e.date <= r.to;
const statsFor = (r, potId) => {
  const out = { dep: 0, wd: 0, n: 0, moves: 0, byPot: {}, byCat: {} };
  for (const e of SV().entries) {
    if (!inRange(e, r)) continue;
    if (potId && e.pot !== potId && e.toPot !== potId) continue;
    out.n++;
    if (e.type === 'move') { out.moves++; continue; }
    if (e.opening) continue; // an opening balance is money you already had, not new saving
    const a = potId ? +e.amount : entryAED(e);
    const bp = out.byPot[e.pot] = out.byPot[e.pot] || { dep: 0, wd: 0 };
    if (e.type === 'dep') { out.dep += a; bp.dep += a; }
    else { out.wd += a; bp.wd += a; const c = e.cat || 'Other'; out.byCat[c] = (out.byCat[c] || 0) + a; }
  }
  out.net = out.dep - out.wd;
  return out;
};
// month-end balance for the last n months (one pot in its currency, or all pots in AED)
const balanceSeries = (potId, n = 12) => {
  const keys = []; for (let i = n - 1; i >= 0; i--) keys.push(addM(calKey(), -i));
  return keys.map(k => {
    const end = lastDay(k);
    let v = 0;
    if (potId) v = sum(SV().entries.filter(e => e.date <= end), e => effOn(e, potId));
    else for (const p of SV().pots.filter(x => !x.archived)) v += conv(sum(SV().entries.filter(e => e.date <= end), e => effOn(e, p.id)), p.currency, 'AED');
    return { k, v };
  });
};
const flowSeries = (potId, n = 12) => {
  const out = []; for (let i = n - 1; i >= 0; i--) { const k = addM(calKey(), -i), s = statsFor({ from: k + '-01', to: lastDay(k) }, potId); out.push({ k, dep: s.dep, wd: s.wd }); }
  return out;
};

// ---------- drawing ----------
const lineSVG = (pts, color, f) => {
  f = f || fmt;
  const W = 320, H = 120, vs = pts.map(p => p.v), max = Math.max(...vs, 0), min = Math.min(...vs, 0), span = (max - min) || 1;
  const xy = pts.map((p, i) => [pts.length > 1 ? i * W / (pts.length - 1) : W / 2, H - 8 - (p.v - min) / span * (H - 16)]);
  const line = xy.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="lsvg" role="img" aria-label="Balance over the last ${pts.length} months">
    <polygon points="0,${H} ${line} ${W},${H}" fill="${color}" opacity=".12"/>
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>
    <div class="trendlab"><span>${esc(mLabel(pts[0].k))}</span><span style="text-align:right">${esc(mLabel(pts[pts.length - 1].k))} · ${hv(f(r2(pts[pts.length - 1].v)))}</span></div>`;
};
const flowBars = series => {
  const mx = Math.max(1, ...series.map(s => Math.max(s.dep, s.wd)));
  return `<div class="flow">${series.map(s => `<div title="${esc(mLabel(s.k))}"><div class="fb"><i class="d" style="height:${s.dep / mx * 100}%"></i><i class="w" style="height:${s.wd / mx * 100}%"></i></div><span>${esc(MN[+s.k.slice(5) - 1].slice(0, 1))}</span></div>`).join('')}</div>
    <div class="legend" style="padding:0 14px 12px"><span><i class="dot d"></i>Saved</span><span><i class="dot w"></i>Spent from savings</span></div>`;
};
const hBars = (obj, cls) => {
  const rows = Object.entries(obj).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]), mx = Math.max(1, ...rows.map(r => r[1]));
  return rows.length ? `<div class="bars">${rows.map(([k, v]) => `<div class="r"><div class="h"><span>${esc(k)}</span><span class="num">${hv(fmtM(r2(v)))}</span></div><div class="track"><i class="${cls || ''}" style="width:${v / mx * 100}%"></i></div></div>`).join('')}</div>` : '<div class="empty">Nothing in this period.</div>';
};

// ---------- screens ----------
const savTop = (title, back) => {
  $('#top').innerHTML = `${back ? '<button class="ib" id="svBack" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 5-7 7 7 7"/></svg></button>' : '<span style="width:44px"></span>'}<h1>${esc(title)}</h1>
    <button class="ib" id="svHide" aria-label="${SV().hide ? 'Show amounts' : 'Hide amounts'}" aria-pressed="${SV().hide}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>${SV().hide ? '<path d="M3 3l18 18"/>' : ''}</svg></button>`;
};
const entryRow = (e, potId) => {
  const p = potById(e.pot);
  let amt, sub, neg = false;
  if (e.type === 'move') {
    const v = potId ? effOn(e, potId) : +e.amount;
    amt = `${(potById(potId || e.pot) || {}).currency === 'AED' || !potId ? '' : ''}${potId ? (v > 0 ? '+' : '−') : ''}${fmt(Math.abs(potId ? v : +e.amount))}`;
    sub = `Move · ${esc(potName(e.pot))} → ${esc(potName(e.toPot))}`; neg = potId ? v < 0 : false;
  } else {
    amt = (e.type === 'dep' ? '+' : '−') + fmt(+e.amount); neg = e.type === 'wd';
    sub = `${e.type === 'dep' ? 'Deposit' : 'Spent'}${potId ? '' : ' · ' + esc(potName(e.pot))}${e.cat && e.type === 'wd' ? ' · ' + esc(e.cat) : ''}`;
  }
  return `<button class="row" data-sve="${esc(e.id)}"><span class="t"><span class="n">${esc(e.title || (e.type === 'dep' ? 'Deposit' : e.type === 'wd' ? 'Withdrawal' : 'Move'))}</span><span class="s">${esc(fmtDay(e.date))} · ${sub}${e.note ? ' · ✎' : ''}</span></span><span class="a"><span class="num ${neg ? 'neg' : ''}">${hv(amt)}</span>${p && p.currency !== 'AED' && e.type !== 'move' ? `<span class="s">${esc(p.currency)}</span>` : ''}</span></button>`;
};
const timeline = (potId) => {
  const r = periodRange(savFilter);
  const list = SV().entries.filter(e => inRange(e, r) && (!potId || e.pot === potId || e.toPot === potId)).sort((a, b) => b.date.localeCompare(a.date));
  const groups = {}; list.forEach(e => { (groups[e.date.slice(0, 7)] = groups[e.date.slice(0, 7)] || []).push(e); });
  return `<div class="filt" role="group" aria-label="Show">${[['week', 'Week'], ['month', 'Month'], ['year', 'Year'], ['all', 'All']].map(([k, l]) => `<button class="cchip" data-filt="${k}" aria-pressed="${savFilter === k}">${l}</button>`).join('')}</div>
    <p class="muted" style="margin:6px 0">${esc(r.label)}</p>
    ${list.length ? Object.keys(groups).map(k => `<h2 style="margin-top:14px">${esc(mLong(k))}</h2><div class="list">${groups[k].map(e => entryRow(e, potId)).join('')}</div>`).join('') : '<div class="list"><div class="empty">No entries in this period.</div></div>'}`;
};
const potRow = p => {
  const fmt = v => p.currency === 'AED' ? fmtM(v) : fmtPlain(v);
  const c = potCalc(p), col = p.color || '#0b7a5c';
  const sub = p.kind === 'goal' && c.target ? `${Math.round(c.pct)}% of ${fmt(c.target)}${c.bal < c.target ? ' · ' + fmt(r2(c.target - c.bal)) + ' to go' : ' · reached'}${p.targetDate ? ' · by ' + fmtDay(p.targetDate) : ''}` : (p.where ? p.where : 'Open savings');
  return `<button class="row" data-pot="${esc(p.id)}"><span class="pdot" style="background:${esc(col)}"></span><span class="t"><span class="n">${esc(p.name)}</span><span class="s">${hv(esc(sub))}</span>${c.pct != null ? `<span class="prog"><i style="width:${c.pct}%;background:${esc(col)}"></i></span>` : ''}</span><span class="a"><span class="num">${hv(money(c.bal, p.currency))}</span>${p.currency !== 'AED' ? `<span class="s num">${hv('≈ ' + MAIN() + ' ' + fmtM(r2(conv(c.bal, p.currency, 'AED'))))}</span>` : ''}</span></button>`;
};
const viewSavings = () => {
  const pot = savPot && potById(savPot);
  if (pot) return viewPot(pot);
  savPot = null;
  savTop('Savings', savView !== 'home');
  const seg = `<div class="seg" role="tablist" style="margin-top:14px">${[['home', 'Overview'], ['cal', 'Calendar'], ['stats', 'Statistics']].map(([k, l]) => `<button role="tab" data-sview="${k}" aria-checked="${savView === k}" aria-selected="${savView === k}">${l}</button>`).join('')}</div>`;
  if (savView === 'cal') return seg + viewCalendar();
  if (savView === 'stats') return seg + viewStats();
  const pots = SV().pots.filter(p => !p.archived), arch = SV().pots.filter(p => p.archived);
  const m = statsFor(periodRange('month'));
  return `${seg}<section class="hero"><div class="lab">Total savings</div><div class="big"><small>${CUR()}</small>${hv(fmtM(r2(totalSavingsAED())))}</div>
    <p class="muted">${esc(mLabel(calKey()))}: saved <b class="num">${hv('+' + fmtM(r2(m.dep)))}</b> · spent <b class="num neg">${hv('−' + fmtM(r2(m.wd)))}</b></p>
    <div class="btns"><button class="btn pri" data-sva="dep">Deposit</button><button class="btn" data-sva="wd">Withdraw</button><button class="btn" data-sva="move">Move</button><button class="btn" id="svNew">New pot</button></div></section>
    <h2>Pots<span class="sp"></span>${pots.length ? `<button class="btn sm" id="svPdf">Export PDF</button>` : ''}</h2>
    <div class="list">${pots.length ? pots.map(potRow).join('') : '<div class="empty">Create a pot for each thing you save for (car, vacation, emergency fund) or each place you keep money. Put its current balance in as the opening amount.</div>'}</div>
    ${pots.length ? '' : '<div class="btns"><button class="btn" id="svImp">Import a savings file</button></div>'}
    ${arch.length ? `<details style="margin-top:14px"><summary class="muted" style="cursor:pointer;min-height:44px;display:flex;align-items:center">Archived pots (${arch.length})</summary><div class="list">${arch.map(potRow).join('')}</div></details>` : ''}
    <h2>Timeline</h2>${timeline(null)}`;
};
const viewPot = p => {
  savTop(p.name, true);
  const c = potCalc(p), col = p.color || '#0b7a5c', cur = p.currency === 'AED' ? MAIN() : p.currency;
  const fmt = v => p.currency === 'AED' ? fmtM(v) : fmtPlain(v);
  return `<section class="hero"><div class="lab">${p.kind === 'goal' ? 'Saved towards goal' : 'Balance'}${p.where ? ' · ' + esc(p.where) : ''}${p.archived ? ' · archived' : ''}</div>
    <div class="big"><small>${esc(cur)}</small>${hv(fmt(c.bal))}</div>
    ${c.pct != null ? `<div class="meter" aria-hidden="true"><i style="width:${c.pct}%;background:${esc(col)}"></i></div>
    <div class="legend"><span>${hv(Math.round(c.pct) + '% of ' + fmt(c.target))}</span><span>${c.bal < c.target ? hv(fmt(r2(c.target - c.bal)) + ' to go') : 'Goal reached'}</span></div>` : ''}
    ${c.perMonth != null && c.bal < c.target ? `<p class="muted">To reach it by ${esc(fmtDay(p.targetDate))}: <b class="num">${hv(cur + ' ' + fmt(Math.ceil(c.perMonth)))}</b> a month for ${c.monthsLeft} month${c.monthsLeft > 1 ? 's' : ''}</p>` : ''}
    <div class="btns"><button class="btn pri" data-sva="dep">Deposit</button><button class="btn" data-sva="wd">Withdraw</button><button class="btn" data-sva="move">Move</button><button class="btn" id="svEdit">Edit</button><button class="btn" id="svPdf">Export PDF</button></div></section>
    <div class="stats"><div class="stat"><span>Deposited</span><b>${hv(fmt(r2(c.dep + c.mvIn)))}</b></div><div class="stat"><span>Spent / moved out</span><b>${hv(fmt(r2(c.wd + c.mvOut)))}</b></div>
    <div class="stat wide"><span>Average saved per month</span><b>${hv(fmt(r2(c.avg)))}</b><span>${c.first ? 'since ' + esc(fmtDay(c.first)) : 'no entries yet'}</span></div></div>
    <h2>Balance, last 12 months</h2><div class="list" style="padding-top:12px">${lineSVG(balanceSeries(p.id), col, fmt)}</div>
    <h2>Saved and spent by month</h2><div class="list">${flowBars(flowSeries(p.id))}</div>
    <h2>Timeline</h2>${timeline(p.id)}`;
};
const viewCalendar = () => {
  const k = calMonth || calKey(), [y, m] = k.split('-').map(Number);
  const first = new Date(y, m - 1, 1), pad = (first.getDay() + 6) % 7, days = new Date(y, m, 0).getDate();
  const day = {}; SV().entries.forEach(e => { if (e.date.slice(0, 7) !== k || e.type === 'move' || e.opening) { if (e.date.slice(0, 7) === k && e.opening) { const d = day[e.date] = day[e.date] || { dep: 0, wd: 0, n: 0 }; d.n++; } return; } const d = day[e.date] = day[e.date] || { dep: 0, wd: 0, n: 0 }; d[e.type] += entryAED(e); d.n++; });
  SV().entries.forEach(e => { if (e.date.slice(0, 7) === k && e.type === 'move') { const d = day[e.date] = day[e.date] || { dep: 0, wd: 0, n: 0 }; d.n++; } });
  const cells = []; for (let i = 0; i < pad; i++) cells.push('<div></div>');
  for (let d = 1; d <= days; d++) {
    const ds = k + '-' + String(d).padStart(2, '0'), x = day[ds];
    cells.push(`<button class="cday${ds === today() ? ' now' : ''}${ds === calDay ? ' sel' : ''}" data-day="${ds}" aria-label="${d} ${MN[m - 1]}${x ? ', ' + x.n + ' entries' : ''}"><b>${d}</b>${x && x.dep ? `<span class="d">${hv('+' + fmtM(Math.round(x.dep)))}</span>` : ''}${x && x.wd ? `<span class="w">${hv('−' + fmtM(Math.round(x.wd)))}</span>` : ''}${x && !x.dep && !x.wd ? '<span>•</span>' : ''}</button>`);
  }
  const ms = statsFor({ from: k + '-01', to: lastDay(k) });
  const sel = calDay && calDay.slice(0, 7) === k ? SV().entries.filter(e => e.date === calDay) : [];
  return `<div class="calhd"><button class="ib" id="calPrev" aria-label="Previous month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 5-7 7 7 7"/></svg></button><b>${esc(mLong(k))}</b><button class="ib" id="calNext" aria-label="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m9 5 7 7-7 7"/></svg></button></div>
    <p class="muted" style="text-align:center;margin:4px 0 10px">Saved <b class="num">${hv('+' + fmtM(r2(ms.dep)))}</b> · spent <b class="num neg">${hv('−' + fmtM(r2(ms.wd)))}</b> (${CUR()})</p>
    <div class="cal">${['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(d => `<div class="cwd">${d}</div>`).join('')}${cells.join('')}</div>
    ${calDay && calDay.slice(0, 7) === k ? `<h2>${esc(fmtDay(calDay))}<span class="sp"></span><button class="btn sm" data-sva="dep" data-date="${esc(calDay)}">Add</button></h2><div class="list">${sel.length ? sel.map(e => entryRow(e, null)).join('') : '<div class="empty">Nothing on this day.</div>'}</div>` : '<p class="muted">Tap a day to see its entries.</p>'}`;
};
const viewStats = () => {
  const r = periodRange(statPeriod, statOffset), s = statsFor(r);
  const potNames = {}; Object.keys(s.byPot).forEach(id => { potNames[potName(id)] = (potNames[potName(id)] || 0) + s.byPot[id].dep; });
  const potSpent = {}; Object.keys(s.byPot).forEach(id => { potSpent[potName(id)] = (potSpent[potName(id)] || 0) + s.byPot[id].wd; });
  const last6 = flowSeries(null, 6), avgNet = sum(last6, x => x.dep - x.wd) / 6;
  return `<div class="filt" role="group" aria-label="Period" style="margin-top:12px">${[['week', 'Week'], ['month', 'Month'], ['year', 'Year'], ['all', 'All']].map(([k, l]) => `<button class="cchip" data-sper="${k}" aria-pressed="${statPeriod === k}">${l}</button>`).join('')}</div>
    <div class="calhd">${statPeriod !== 'all' ? '<button class="ib" id="stPrev" aria-label="Previous period"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 5-7 7 7 7"/></svg></button>' : '<span></span>'}<b>${esc(r.label)}</b>${statPeriod !== 'all' && statOffset < 0 ? '<button class="ib" id="stNext" aria-label="Next period"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m9 5 7 7-7 7"/></svg></button>' : '<span style="width:44px"></span>'}</div>
    <section class="hero" style="padding-top:8px"><div class="lab">Net saved (${CUR()})</div><div class="big ${s.net < 0 ? 'neg' : ''}"><small>${CUR()}</small>${hv((s.net < 0 ? '−' : '') + fmtM(r2(Math.abs(s.net))))}</div></section>
    <div class="stats"><div class="stat"><span>Saved</span><b>${hv(fmtM(r2(s.dep)))}</b></div><div class="stat"><span>Spent from savings</span><b class="neg">${hv(fmtM(r2(s.wd)))}</b></div>
      <div class="stat"><span>Entries</span><b>${s.n}</b><span>${s.moves ? s.moves + ' move' + (s.moves > 1 ? 's' : '') + ' between pots' : ''}</span></div><div class="stat"><span>Average net per month</span><b>${hv(fmtM(r2(avgNet)))}</b><span>last 6 months</span></div></div>
    <h2>Total savings, last 12 months</h2><div class="list" style="padding-top:12px">${lineSVG(balanceSeries(null), '#0b7a5c', fmtM)}</div>
    <h2>Saved and spent by month</h2><div class="list">${flowBars(flowSeries(null))}</div>
    <h2>Saved by pot</h2><div class="list">${hBars(potNames)}</div>
    <h2>Spent from savings by pot</h2><div class="list">${hBars(potSpent, 'over')}</div>
    <h2>Spent from savings by category</h2><div class="list">${hBars(s.byCat, 'over')}</div>`;
};
const bindSavings = () => {
  const b = (id, f) => { const el = document.getElementById(id); if (el) el.onclick = f; };
  b('svHide', () => { SV().hide = !SV().hide; save(); render(); });
  b('svBack', () => { if (savPot) savPot = null; else savView = 'home'; render(); window.scrollTo(0, 0); });
  b('svNew', () => potForm());
  b('svImp', () => $('#fileJ').click());
  b('svEdit', () => potForm(potById(savPot)));

// ---------- actual spending from bank SMS (FinArt-style), bills due, plan vs actual ----------
// The Month tab is the plan; this is what really happened. SMS are read on the phone by the app (1.3+);
// here they become transactions and bills. Nothing is sent anywhere.
const ACT = () => {
  if (!S.act) S.act = {};
  const a = S.act;
  a.txns = a.txns || []; a.bills = a.bills || []; a.income = a.income || {}; a.seen = a.seen || {};
  a.map = a.map || {}; a.map.merchants = a.map.merchants || {}; a.map.cards = a.map.cards || {}; a.map.rules = a.map.rules || [];
  // older "always use this" entries matched the exact shop name only; turn them into keyword rules once
  if (!a.map.rulesMigrated) {
    for (const k in a.map.merchants) { const m = a.map.merchants[k], kw = shopKey(k); if (kw && !a.map.rules.some(r => r.kw === kw)) a.map.rules.push({ id: uid(), kw, cat: m.cat || 'Other', line: m.line || '', ignore: !!m.ignore }); }
    a.map.merchants = {}; a.map.rulesMigrated = true;
  }
  a.map.billers = a.map.billers || {};
  a.cfg = Object.assign({ remindDays: 3, remindOnDue: true, remindTime: '09:00', notify: true }, a.cfg || {});
  return a;
};
const mKey = m => String(m || '').toUpperCase().replace(/\s+/g, ' ').trim();
// ---------- shop rules: a keyword in the shop name decides the category ----------
// Banks cut names to ~22 letters and add branch numbers, so rules match a keyword, not the full name.
const SHOP_NOISE = new Set(['LLC', 'L', 'LL', 'FZE', 'FZCO', 'FZ', 'FZC', 'FZLLC', 'CO', 'COMPANY', 'TRADING', 'TRDG', 'TRD', 'EST', 'ESTABLISHMENT', 'LTD', 'LIMITED', 'INC', 'BRANCH', 'BR', 'PJSC', 'PSC', 'GROUP', 'AE', 'UAE', 'COM', 'WWW', 'DXB']);
const SHOP_GENERIC = new Set(['AL', 'EL', 'THE', 'NEW', 'CITY', 'SUPER', 'DUBAI', 'ABU', 'SHARJAH', 'AJMAN', 'MY', 'GRAND', 'ROYAL', 'STAR', 'BEST', 'GOLDEN', 'FIRST']);
const shopNorm = m => String(m || '').toUpperCase().replace(/[^A-Z0-9&*]+/g, ' ').replace(/\s+/g, ' ').trim();
const shopKey = m => {
  let s = String(m || '').toUpperCase();
  if (s.includes('*')) { const after = s.split('*').pop().trim(); if (/[A-Z]{3,}/.test(after)) s = after; } // payment service * real shop
  const words = s.replace(/\.(COM|AE|NET|ORG)\b/g, ' ').replace(/[^A-Z0-9& ]+/g, ' ').split(/\s+/).filter(w => w && !SHOP_NOISE.has(w) && !/\d/.test(w));
  if (!words.length) return shopNorm(m).slice(0, 30);
  const take = words[0].length >= 5 && !SHOP_GENERIC.has(words[0]) ? 1 : 2;
  return words.slice(0, take).join(' ');
};
const ruleHits = (r, merchant) => { const kw = shopNorm(r.kw).replace(/\*/g, ' ').trim(); if (kw.length < 2) return false; return (' ' + shopNorm(merchant).replace(/\*/g, ' ').replace(/\s+/g, ' ') + ' ').includes(' ' + kw + ' '); };
const shopRule = merchant => { if (!merchant) return null; let best = null; for (const r of ACT().map.rules) if (ruleHits(r, merchant) && (!best || r.kw.length > best.kw.length)) best = r; return best; };
const SMS = () => BRIDGE && BRIDGE.smsStatus ? BRIDGE : null;
const addDays = (ymdS, n) => { const d = new Date(ymdS + 'T00:00'); d.setDate(d.getDate() + n); return ymd(d); };
const NONSPEND = { salary: 1, unknownCredit: 1, installment: 1, wallet: 1, income: 1, ignoredMsg: 1, cardPayment: 1 };
// waiting for you (Pending actions): not counted anywhere until answered
const PENDING = { needs: 1, review: 1, month: 1, cardtype: 1 };
const KLABEL = { income: 'Money received', ignoredMsg: 'Ignored message', purchase: 'Card purchase', refund: 'Refund', cardPayment: 'Card bill payment', wallet: 'Wallet spend', installment: 'Instalment plan', salary: 'Salary', unknown: 'Money out', unknownCredit: 'Money in', manual: 'Cash / manual' };

// credit-card purchases count one by one (in the month you choose); paying the card's bill doesn't count again
const cardType = t => t.cardType || ((ACT().map.cards[t.card] || {}).type) || '';
const cardLabel = c => { const cc = ACT().map.cards[c] || {}; return cc.name ? `${cc.name} (${c})` : `Card ${c}`; };
// signed amount a transaction adds to "actually spent" (0 = not counted)
const spendOf = t => {
  if (t.status === 'ignored' || NONSPEND[t.kind] || PENDING[t.status]) return 0;
  if (t.sav && t.sav.counts === false) return 0; // moved to/paid from savings and set not to count
  if (t.status === 'income') return 0;
  if (t.kind === 'refund') return -(+t.amount);
  return +t.amount; // purchase, unknown, manual
};
const whyNot = t => {
  if (t.status === 'ignored') return 'not a transaction';
  if (t.kind === 'wallet') return 'wallet spend (the top-up already counted)';
  if (t.kind === 'installment') return 'instalment plan (purchase already counted)';
  if (t.kind === 'cardPayment') return 'card bill payment · the purchases are counted instead';
  if (PENDING[t.status]) return 'waiting for you in Pending actions';
  return '';
};
// which tracking month a transaction counts in: your choice, or the salary rule, or the month its date falls in
const isSalary = t => t.kind === 'salary' || t.status === 'income-salary';
const salaryMonth = d => { // the month whose start date is closest to the day the salary arrived
  const p0 = periodOf(d), s0 = new Date(periodStart(p0) + 'T00:00'), s1 = new Date(periodStart(addM(p0, 1)) + 'T00:00'), x = new Date(d + 'T00:00');
  return (s1 - x) < (x - s0) ? addM(p0, 1) : p0;
};
const txnMonth = t => t.month || (isSalary(t) && TRK().salaryNext ? salaryMonth(t.date || today()) : periodOf(t.date || today()));
const monthTxns = k => ACT().txns.filter(t => txnMonth(t) === k);
const billMonth = b => (b.due ? periodOf(b.due) : '');
const actualIncome = k => {
  const inc = ACT().income[k] || {};
  const smsSalary = sum(monthTxns(k).filter(t => (t.kind === 'salary' || t.status === 'income-salary') && t.status !== 'ignored'), t => +t.amount);
  const salary = inc.salary != null && inc.salary !== '' ? +inc.salary : smsSalary;
  const extras = sum(inc.extras || [], x => +x.amount) + sum(monthTxns(k).filter(t => t.status === 'income' || (t.kind === 'income' && t.status !== 'ignored' && t.status !== 'review')), t => +t.amount);
  return { salary, smsSalary, extras, total: salary + extras, manualSalary: inc.salary != null && inc.salary !== '' };
};
const actualSpent = k => sum(monthTxns(k), spendOf);

// ---------- bills ----------
const billTitle = b => b.kind === 'statement' ? `${b.bank ? b.bank + ' ' : ''}card ${b.card}` : `${b.biller || 'Bill'}${b.billMonth ? ' · ' + b.billMonth : ''}`;
const billLine = b => b.kind === 'statement' ? ((ACT().map.cards[b.card] || {}).line || '') : ((ACT().map.billers[b.biller] || {}).line || '');
const setLineDone = (k, name, done) => {
  const m = S.months[k]; if (!m || !name) return;
  const x = m.expenses.find(e => e.name.toLowerCase() === name.toLowerCase()); if (!x) return;
  if (done) { x.done = true; x.doneAuto = true; } else if (!x.done || x.doneAuto) { x.done = false; x.doneAuto = false; }
};
const payBill = (b, amt, date, txnId) => {

  setLineDone(periodOf(date), billLine(b), true);
  if (b.due) setLineDone(periodOf(b.due), billLine(b), true);
};
const openBills = () => ACT().bills.filter(b => b.status !== 'paid');

// ---------- reading SMS events (from the app's queue or a history read) ----------
const processEvent = (ev, quiet) => {
  const a = ACT();
  if (ev.type === 'decision') {
    const t = a.txns.find(x => x.key === ev.key);
    if (!t) { const b = a.bills.find(x => x.key === ev.key); if (b && ev.action === 'confirm') confirmReview(b); return; }

// ---------- teaching the app new SMS formats ----------
// You tap the amount, name and date in a sample message; the app turns the rest of the wording into a
// pattern (numbers, month names and names become blanks) that reads every similar message from then on.
// Patterns are written so the Android part (Java) and the screens (JavaScript) read them the same way.
const TEACH_TYPES = {
  purchase: { label: 'Spending', fields: [['amount', 'Amount', 1], ['merchant', 'Shop / merchant', 0], ['card', 'Card digits', 0]] },
  refund: { label: 'Refund', fields: [['amount', 'Amount', 1], ['merchant', 'Shop / merchant', 0]] },
  salary: { label: 'Salary', fields: [['amount', 'Amount', 1]] },
  income: { label: 'Extra cash received', fields: [['amount', 'Amount', 1], ['merchant', 'From', 0]] },
  bill: { label: 'Bill due', fields: [['amount', 'Amount due', 1], ['due', 'Due date', 0]], name: 1 },
  statement: { label: 'Card statement', fields: [['total', 'Total due', 1], ['min', 'Minimum due', 0], ['due', 'Due date', 1], ['card', 'Card digits', 0]] },
  cardPayment: { label: 'Card bill payment', fields: [['amount', 'Amount', 1], ['card', 'Card digits', 0]] },
  ignored: { label: 'Not money (ignore similar messages)', fields: [] }
};
const FIELD_RE = {
  amount: '[\\d,]+(?:\\.\\d+)?', total: '[\\d,]+(?:\\.\\d+)?', min: '[\\d,]+(?:\\.\\d+)?', card: '\\d{2,6}',
  due: '(?:\\d{1,2}[/.-]\\d{1,2}[/.-]\\d{2,4}|\\d{1,2}[ -][A-Za-z]{3,9}[ ,-]+\\d{2,4}|[A-Za-z]{3,9} \\d{1,2},? \\d{4})'
};
const MONTH_WORDS = /^(jan(uary)?|feb(ruary)?|mar(ch)?|apr(il)?|may|june?|july?|aug(ust)?|sep(t|tember)?|oct(ober)?|nov(ember)?|dec(ember)?)$/i;
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const tokenize = body => { const out = []; const re = /[A-Za-z]+|\d+(?:[.,]\d+)*|\S/g; let m; while ((m = re.exec(body))) out.push({ t: m[0], s: m.index, e: m.index + m[0].length }); return out; };

// spans: { field: [start, end] } in character positions of body
const buildPattern = (body, spans, kind) => {
  const toks = tokenize(body), fs = Object.keys(spans);
  let ws = 0, we = Math.min(body.length, 90);
  if (fs.length) {
    const lo = Math.min(...fs.map(f => spans[f][0])), hi = Math.max(...fs.map(f => spans[f][1]));
    ws = Math.max(0, lo - 45); we = Math.min(body.length, hi + 30);
  }
  // snap the window to whole tokens
  const inWin = toks.filter(t => t.e > ws && t.s < we);
  if (!inWin.length) return null;
  let out = '', prevEnd = null, i = 0;
  const parts = [];
  while (i < inWin.length) {
    const t = inWin[i];
    const f = fs.find(k => t.s >= spans[k][0] && t.s < spans[k][1]);
    if (prevEnd != null && /\s/.test(body.slice(prevEnd, t.s))) parts.push({ ws: 1 });
    if (f) {
      let j = i; while (j + 1 < inWin.length && inWin[j + 1].s < spans[f][1]) j++;
      parts.push({ f }); prevEnd = inWin[j].e; i = j + 1; continue;
    }
    if (/^[A-Za-z]+$/.test(t.t)) parts.push({ lit: MONTH_WORDS.test(t.t) ? '[A-Za-z]+' : reEsc(t.t) });
    else if (/^\d/.test(t.t)) parts.push({ lit: '[\\d,.]+' });
    else parts.push({ lit: reEsc(t.t) });
    prevEnd = t.e; i++;
  }
  // a free-text field needs wording after it to know where it stops
  parts.forEach((p, k) => {
    if (p.ws) { out += '\\s*'; return; }
    if (p.lit) { out += p.lit; return; }
    const last = !parts.slice(k + 1).some(x => x.lit || x.f);
    const pat = p.f === 'merchant' ? (last ? '[^\\n.]+' : '.+?') : FIELD_RE[p.f];
    out += `(?<${p.f}>${pat})`;
  });
  return { match: '(?is)' + out, fields: fs };
};
const jsRe = p => { let flags = ''; const m = /^\(\?([a-z]+)\)/.exec(p); if (m) { p = p.slice(m[0].length); if (m[1].includes('i')) flags += 'i'; if (m[1].includes('s')) flags += 's'; } return new RegExp(p, flags); };
const MON3 = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
const normDateJS = s => {
  s = String(s || '');
  let m = /(\d{1,2})[/.-](\d{1,2})[/.-](\d{2,4})/.exec(s);
  let d, mo, y;
  if (m) { d = +m[1]; mo = +m[2]; y = +m[3]; }
  else if ((m = /(\d{1,2})[ -]([A-Za-z]{3,9})[ ,-]+(\d{2,4})/.exec(s))) { d = +m[1]; mo = MON3.indexOf(m[2].slice(0, 3).toLowerCase()) + 1; y = +m[3]; }
  else if ((m = /([A-Za-z]{3,9}) (\d{1,2}),? (\d{4})/.exec(s))) { d = +m[2]; mo = MON3.indexOf(m[1].slice(0, 3).toLowerCase()) + 1; y = +m[3]; }
  else return '';
  if (y < 100) y += 2000;
  if (!(mo >= 1 && mo <= 12 && d >= 1 && d <= 31)) return '';
  return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
};
// read a message with one taught pattern; same output shape as the Android engine
const applyRule = (r, body) => {
  let m; try { m = jsRe(r.match).exec(body); } catch (e) { return null; }
  if (!m) return null;
  const o = { rule: 'learned', kind: r.kind, learned: r.id, trusted: !!r.trusted };
  (r.fields || []).forEach(f => { if (m.groups && m.groups[f] != null) o[f] = m.groups[f].trim(); });
  if (r.biller) o.biller = r.biller;
  if (o.due) o.due = normDateJS(o.due);
  return o;
};
const learnedParse = body => { for (const r of (ACT().learned || [])) { const o = applyRule(r, body || ''); if (o) return o; } return null; };
const confirmLearned = id => { const r = (ACT().learned || []).find(x => x.id === id); if (!r) return; r.confirms = (r.confirms || 0) + 1; if (r.confirms >= 3) r.trusted = true; };

// messages the app couldn't fully read, newest first
const unreadMsgs = () => ACT().txns.filter(t => t.body && (t.kind === 'unknown' || t.kind === 'unknownCredit') && t.status !== 'ignored').sort((a, b) => b.date.localeCompare(a.date));

// re-read stored messages with a new or changed pattern
const reapplyRule = r => {
  const a = ACT(); let n = 0;
  for (const t of a.txns.slice()) {
    if (!t.body || !(t.kind === 'unknown' || t.kind === 'unknownCredit' || t.learned === r.id)) continue;
    const p = applyRule(r, t.body); if (!p) continue;
    n++;
    a.txns = a.txns.filter(x => x.id !== t.id);
    delete a.seen[t.key];
    processEvent({ type: 'sms', key: t.key, ts: Date.parse(t.date + 'T12:00:00'), body: t.body, parsed: Object.assign(p, { date: t.date, trusted: true }) });
    const nt = a.txns.find(x => x.key === t.key); if (nt && t.note) nt.note = t.note;
  }
  return n;
};
